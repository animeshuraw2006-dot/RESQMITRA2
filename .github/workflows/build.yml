name: Build ResQMitra

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only contains lib/, assets/ and pubspec.yaml – generate the
      # android/ folder here, then add the permissions the app needs.
      - name: Generate Android platform folder
        run: |
          flutter create --org com.resqmitra --project-name resqmitra --platforms=android .
          rm -rf test

      - name: Add permissions + minSdk
        run: python3 scripts/patch_android.py

      - run: flutter pub get

      # The another_telephony plugin compiles Java for 11 but defaults Kotlin to 1.8.
      # Align its Kotlin bytecode target with Java to prevent Gradle JVM target validation failure.
      - name: Align another_telephony JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          cache = Path.home() / ".pub-cache"
          candidates = list(cache.glob("hosted/pub.dev/another_telephony-*/android/build.gradle"))
          candidates += list(cache.glob("hosted/pub.dartlang.org/another_telephony-*/android/build.gradle"))
          if not candidates:
              raise SystemExit("Could not find another_telephony Android Gradle file in pub cache")
          for gradle_file in candidates:
              content = gradle_file.read_text()
              marker = "// RESQMITRA JVM target fix"
              if marker not in content:
                  content += "\n\n" + marker + "\ntasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {\n    kotlinOptions { jvmTarget = '11' }\n}\n"
                  gradle_file.write_text(content)
              print("Patched", gradle_file)

      - name: Native launch screen (first video frame)
        continue-on-error: true
        run: dart run flutter_native_splash:create

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ResQMitra-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Web build (optional)
    runs-on: ubuntu-latest
    continue-on-error: true   # some plugins (torch, SMS) are mobile-only
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          flutter create --org com.resqmitra --project-name resqmitra --platforms=web .
          rm -rf test
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: ResQMitra-web
          path: build/web
