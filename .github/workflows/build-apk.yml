name: Build ResQMitra APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify required assets
        run: |
          test -f assets/video/resqmitra_intro.mp4
          test -f assets/audio/siren.ogg
          test -f assets/images/resqmitra_logo.jpeg
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Generate Android platform files if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name=resqmitra .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResQMitra-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
