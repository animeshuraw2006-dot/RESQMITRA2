name: resqmitra
description: ResQMitra - Be the first to respond.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.9.1
  audioplayers: ^6.1.0
  torch_light: ^1.1.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  record: ^6.0.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  wakelock_plus: ^1.2.8
  another_telephony: ^0.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/ui/
    - assets/badges/
    - assets/splash/
    - assets/icon/

# Native (pre-Flutter) launch screen = first frame of the intro video, full screen,
# so nothing blank shows between tapping the icon and the video.
# Generate with:  dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/first_frame.png
  fullscreen: true
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  web_image_mode: cover
  android_12:
    color: "#FFFFFF"

# App (launcher) icon – white background. Generate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  min_sdk_android: 23
