name: resq_mitra
description: RESQ-MITRA emergency assistance and responder application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  sqflite: ^2.4.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
